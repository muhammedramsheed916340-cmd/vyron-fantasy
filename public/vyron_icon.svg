<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#00D4AA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="64" height="64" rx="14" fill="#0f0f23"/>
  <!-- Inner subtle hexagon -->
  <polygon points="32,8 52,18 52,46 32,56 12,46 12,18" fill="none" stroke="url(#fg)" stroke-width="0.8" stroke-opacity="0.3"/>
  <!-- V shape with glow -->
  <path d="M16,18 L32,48 L48,18" stroke="url(#fg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  <!-- Core AI dot -->
  <circle cx="32" cy="48" r="4" fill="url(#fg)"/>
  <circle cx="32" cy="48" r="2" fill="#0f0f23"/>
  <!-- Side dots -->
  <circle cx="16" cy="18" r="2" fill="#6C63FF" opacity="0.5"/>
  <circle cx="48" cy="18" r="2" fill="#00D4AA" opacity="0.5"/>
</svg>