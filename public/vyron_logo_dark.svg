<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 130" fill="none">
  <defs>
    <linearGradient id="vyronGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B83FF"/>
      <stop offset="50%" style="stop-color:#20E8BE"/>
      <stop offset="100%" style="stop-color:#FF8B8B"/>
    </linearGradient>
    <linearGradient id="iconGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B83FF"/>
      <stop offset="100%" style="stop-color:#20E8BE"/>
    </linearGradient>
    <linearGradient id="text3dDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0AAFF"/>
      <stop offset="50%" style="stop-color:#8B83FF"/>
      <stop offset="100%" style="stop-color:#5A52CC"/>
    </linearGradient>
    <filter id="shadow3dDark" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#8B83FF" flood-opacity="0.25"/>
    </filter>
    <filter id="iconGlowDark" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- VYRON 3D Icon (dark variant) -->
  <g transform="translate(8, 8)">
    <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="url(#iconGradDark)" opacity="0.18" stroke="url(#iconGradDark)" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M25,30 L50,75 L75,30" stroke="url(#iconGradDark)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#iconGlowDark)"/>
    <circle cx="50" cy="75" r="6" fill="url(#iconGradDark)"/>
    <circle cx="50" cy="75" r="3" fill="#1a1a2e"/>
    <line x1="50" y1="81" x2="50" y2="92" stroke="url(#iconGradDark)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="45" y1="88" x2="55" y2="88" stroke="url(#iconGradDark)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="25" cy="30" r="3" fill="url(#iconGradDark)" opacity="0.6"/>
    <circle cx="75" cy="30" r="3" fill="url(#iconGradDark)" opacity="0.6"/>
  </g>

  <!-- VYRON 3D Text - dark variant -->
  <text x="124" y="75" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="900" letter-spacing="6" fill="#0a0a2e" opacity="0.3">VYRON</text>
  <text x="122" y="73" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="900" letter-spacing="6" fill="#2a2a5e" opacity="0.5">VYRON</text>
  <text x="120" y="72" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="900" letter-spacing="6" fill="url(#text3dDark)" filter="url(#shadow3dDark)">VYRON</text>
  <text x="120" y="70" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="900" letter-spacing="6" fill="none" stroke="#fff" stroke-width="0.3" stroke-opacity="0.15">VYRON</text>

  <!-- Tagline -->
  <text x="122" y="95" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="3" fill="url(#vyronGradDark)" opacity="0.85">AI FANTASY CRICKET</text>
</svg>