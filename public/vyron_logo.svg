<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 130" fill="none">
  <defs>
    <linearGradient id="vyronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="50%" style="stop-color:#00D4AA"/>
      <stop offset="100%" style="stop-color:#FF6B6B"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#00D4AA"/>
    </linearGradient>
    <linearGradient id="text3dFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9B94FF"/>
      <stop offset="50%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#4A42CC"/>
    </linearGradient>
    <filter id="shadow3d" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#6C63FF" flood-opacity="0.2"/>
    </filter>
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- VYRON 3D Icon -->
  <g transform="translate(8, 8)">
    <!-- Hexagon outline -->
    <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="url(#iconGrad)" opacity="0.12" stroke="url(#iconGrad)" stroke-width="2" stroke-opacity="0.5"/>
    <!-- V shape with glow -->
    <path d="M25,30 L50,75 L75,30" stroke="url(#iconGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#iconGlow)"/>
    <!-- AI core dot -->
    <circle cx="50" cy="75" r="6" fill="url(#iconGrad)"/>
    <circle cx="50" cy="75" r="3" fill="#ffffff"/>
    <!-- Circuit lines -->
    <line x1="50" y1="81" x2="50" y2="92" stroke="url(#iconGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="45" y1="88" x2="55" y2="88" stroke="url(#iconGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Side accent dots -->
    <circle cx="25" cy="30" r="3" fill="url(#iconGrad)" opacity="0.6"/>
    <circle cx="75" cy="30" r="3" fill="url(#iconGrad)" opacity="0.6"/>
  </g>

  <!-- VYRON 3D Text - extruded layers -->
  <!-- Shadow layer -->
  <text x="124" y="75" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="900" letter-spacing="6" fill="#1a1a3e" opacity="0.4">VYRON</text>
  <!-- Mid layer -->
  <text x="122" y="73" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="900" letter-spacing="6" fill="#3a3a6e" opacity="0.5">VYRON</text>
  <!-- Front face -->
  <text x="120" y="72" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="900" letter-spacing="6" fill="url(#text3dFace)" filter="url(#shadow3d)">VYRON</text>
  <!-- Top highlight -->
  <text x="120" y="70" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="900" letter-spacing="6" fill="none" stroke="#fff" stroke-width="0.3" stroke-opacity="0.12">VYRON</text>

  <!-- Tagline -->
  <text x="122" y="95" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="3" fill="url(#vyronGrad)" opacity="0.8">AI FANTASY CRICKET</text>
</svg>