<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="vyronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00D4AA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- VYRON Icon - Futuristic V with AI circuit element -->
  <g transform="translate(8, 10)">
    <!-- Outer hexagon shape -->
    <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="url(#iconGrad)" opacity="0.15" stroke="url(#iconGrad)" stroke-width="2"/>
    <!-- Inner V shape -->
    <path d="M25,30 L50,75 L75,30" stroke="url(#iconGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- AI dot/circuit element at V apex -->
    <circle cx="50" cy="75" r="6" fill="url(#iconGrad)"/>
    <circle cx="50" cy="75" r="3" fill="#ffffff"/>
    <!-- Small circuit lines -->
    <line x1="50" y1="81" x2="50" y2="92" stroke="url(#iconGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="45" y1="88" x2="55" y2="88" stroke="url(#iconGrad)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Side accents -->
    <circle cx="25" cy="30" r="3" fill="url(#iconGrad)" opacity="0.6"/>
    <circle cx="75" cy="30" r="3" fill="url(#iconGrad)" opacity="0.6"/>
  </g>
  <!-- VYRON Text -->
  <text x="120" y="72" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="6" fill="url(#vyronGrad)">VYRON</text>
  <!-- Tagline -->
  <text x="122" y="95" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="400" letter-spacing="3" fill="#8888AA">AI FANTASY CRICKET</text>
</svg>