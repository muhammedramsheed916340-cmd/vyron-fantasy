<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <defs>
    <!-- Main gradient - vibrant purple to teal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="40%" style="stop-color:#12123a"/>
      <stop offset="100%" style="stop-color:#0a2a2a"/>
    </linearGradient>
    <!-- 3D text gradient -->
    <linearGradient id="text3d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9B94FF"/>
      <stop offset="50%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#4A42CC"/>
    </linearGradient>
    <!-- Accent gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="50%" style="stop-color:#00D4AA"/>
      <stop offset="100%" style="stop-color:#FF6B6B"/>
    </linearGradient>
    <!-- Glow gradient -->
    <radialGradient id="glow1" cx="30%" cy="40%" r="40%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6C63FF;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="60%" r="35%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="85%" cy="30%" r="25%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:0"/>
    </radialGradient>
    <!-- Mesh pattern -->
    <pattern id="mesh" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#6C63FF" stroke-width="0.3" opacity="0.15"/>
      <line x1="0" y1="0" x2="0" y2="60" stroke="#6C63FF" stroke-width="0.3" opacity="0.15"/>
    </pattern>
    <!-- 3D shadow filter -->
    <filter id="textShadow3d" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#6C63FF" flood-opacity="0.3"/>
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  
  <!-- Mesh overlay -->
  <rect width="1200" height="400" fill="url(#mesh)"/>

  <!-- Ambient glow spots -->
  <rect width="1200" height="400" fill="url(#glow1)"/>
  <rect width="1200" height="400" fill="url(#glow2)"/>
  <rect width="1200" height="400" fill="url(#glow3)"/>

  <!-- Animated-looking diagonal light streaks -->
  <line x1="-50" y1="200" x2="400" y2="-50" stroke="#6C63FF" stroke-width="1" opacity="0.12"/>
  <line x1="200" y1="450" x2="650" y2="-50" stroke="#00D4AA" stroke-width="0.8" opacity="0.10"/>
  <line x1="600" y1="450" x2="1050" y2="-50" stroke="#FF6B6B" stroke-width="0.8" opacity="0.08"/>
  <line x1="800" y1="450" x2="1250" y2="0" stroke="#6C63FF" stroke-width="0.6" opacity="0.08"/>

  <!-- 3D Perspective floor/ground effect -->
  <path d="M0,320 Q300,280 600,300 Q900,320 1200,290 L1200,400 L0,400 Z" fill="#0a0a1a" opacity="0.6"/>
  <path d="M0,340 Q300,310 600,325 Q900,340 1200,315 L1200,400 L0,400 Z" fill="#0a0a1a" opacity="0.4"/>

  <!-- Left side - VYRON 3D Icon -->
  <g transform="translate(100, 80)">
    <!-- Outer rotating hexagon - 3D extruded -->
    <polygon points="100,10 180,50 180,130 100,170 20,130 20,50" fill="#6C63FF" opacity="0.08" stroke="#6C63FF" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- 3D extrusion right side -->
    <polygon points="180,50 195,60 195,140 180,130" fill="#4A42CC" opacity="0.15"/>
    <polygon points="180,130 195,140 115,180 100,170" fill="#4A42CC" opacity="0.12"/>
    <!-- Inner hexagon -->
    <polygon points="100,25 165,55 165,125 100,155 35,125 35,55" fill="none" stroke="#00D4AA" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- V shape - bold 3D -->
    <path d="M45,55 L100,140 L155,55" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#iconGlow)"/>
    <!-- V shadow for 3D depth -->
    <path d="M48,60 L100,143 L152,60" stroke="#000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.2"/>
    <path d="M45,55 L100,140 L155,55" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- AI core dot at apex -->
    <circle cx="100" cy="140" r="10" fill="#6C63FF" filter="url(#iconGlow)"/>
    <circle cx="100" cy="140" r="6" fill="#00D4AA"/>
    <circle cx="100" cy="140" r="3" fill="#ffffff"/>
    
    <!-- Circuit lines from apex -->
    <line x1="100" y1="150" x2="100" y2="168" stroke="#00D4AA" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="92" y1="162" x2="108" y2="162" stroke="#00D4AA" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <circle cx="100" cy="168" r="2" fill="#00D4AA" opacity="0.6"/>
    
    <!-- Side accent dots -->
    <circle cx="45" cy="55" r="5" fill="#6C63FF" opacity="0.5"/>
    <circle cx="155" cy="55" r="5" fill="#FF6B6B" opacity="0.5"/>
    <circle cx="45" cy="55" r="2.5" fill="#8B83FF" opacity="0.8"/>
    <circle cx="155" cy="55" r="2.5" fill="#FF8B8B" opacity="0.8"/>
    
    <!-- Floating particles -->
    <circle cx="15" cy="90" r="1.5" fill="#6C63FF" opacity="0.4"/>
    <circle cx="185" cy="80" r="1" fill="#00D4AA" opacity="0.5"/>
    <circle cx="80" cy="20" r="1.5" fill="#FF6B6B" opacity="0.3"/>
    <circle cx="130" cy="170" r="1" fill="#6C63FF" opacity="0.4"/>
  </g>

  <!-- Center - VYRON 3D Text -->
  <g transform="translate(340, 100)">
    <!-- 3D extrusion layers (back to front) -->
    <!-- Layer 5 (deepest shadow) -->
    <text x="4" y="6" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="120" font-weight="900" letter-spacing="12" fill="#1a1a3e" opacity="0.5">VYRON</text>
    <!-- Layer 4 -->
    <text x="3" y="4.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="120" font-weight="900" letter-spacing="12" fill="#2a2a5e" opacity="0.5">VYRON</text>
    <!-- Layer 3 -->
    <text x="2" y="3" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="120" font-weight="900" letter-spacing="12" fill="#3a3a6e" opacity="0.6">VYRON</text>
    <!-- Layer 2 (mid shadow) -->
    <text x="1" y="1.5" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="120" font-weight="900" letter-spacing="12" fill="#4a4a7e" opacity="0.7">VYRON</text>
    <!-- Front face with gradient -->
    <text x="0" y="0" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="120" font-weight="900" letter-spacing="12" fill="url(#text3d)" filter="url(#textShadow3d)">VYRON</text>
    <!-- Specular highlight on top edge -->
    <text x="0" y="-2" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="120" font-weight="900" letter-spacing="12" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.15">VYRON</text>
    
    <!-- Subtitle with glow -->
    <text x="8" y="50" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="8" fill="url(#accent)" opacity="0.9">AI FANTASY CRICKET</text>
    
    <!-- Thin accent line under subtitle -->
    <rect x="8" y="60" width="340" height="1.5" rx="0.75" fill="url(#accent)" opacity="0.5"/>
  </g>

  <!-- Right side - Feature pills / floating elements -->
  <g transform="translate(830, 100)">
    <!-- Feature badge 1 -->
    <rect x="0" y="0" width="140" height="36" rx="18" fill="#6C63FF" opacity="0.15" stroke="#6C63FF" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="22" cy="18" r="6" fill="#6C63FF" opacity="0.8"/>
    <text x="36" y="23" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#B8B3FF">Grand League</text>
    
    <!-- Feature badge 2 -->
    <rect x="155" y="0" width="120" height="36" rx="18" fill="#00D4AA" opacity="0.12" stroke="#00D4AA" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="177" cy="18" r="6" fill="#00D4AA" opacity="0.8"/>
    <text x="191" y="23" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#66E8CC">Dream11</text>
    
    <!-- Feature badge 3 -->
    <rect x="0" y="50" width="130" height="36" rx="18" fill="#FF6B6B" opacity="0.12" stroke="#FF6B6B" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="22" cy="68" r="6" fill="#FF6B6B" opacity="0.8"/>
    <text x="36" y="73" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#FF9B9B">H2H Mode</text>
    
    <!-- Feature badge 4 -->
    <rect x="145" y="50" width="130" height="36" rx="18" fill="#00D4AA" opacity="0.12" stroke="#00D4AA" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="167" cy="68" r="6" fill="#00D4AA" opacity="0.8"/>
    <text x="181" y="73" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="600" fill="#66E8CC">My11Circle</text>
    
    <!-- AI badge -->
    <rect x="40" y="110" width="100" height="36" rx="18" fill="url(#accent)" opacity="0.2" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.4"/>
    <text x="62" y="133" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" opacity="0.9">AI POWER</text>
  </g>

  <!-- Bottom reflection/shine line -->
  <rect x="100" y="370" width="1000" height="1" rx="0.5" fill="url(#accent)" opacity="0.15"/>
  
  <!-- Corner accents -->
  <!-- Top-left -->
  <line x1="0" y1="0" x2="40" y2="0" stroke="#6C63FF" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="0" x2="0" y2="40" stroke="#6C63FF" stroke-width="2" opacity="0.6"/>
  <!-- Top-right -->
  <line x1="1200" y1="0" x2="1160" y2="0" stroke="#00D4AA" stroke-width="2" opacity="0.6"/>
  <line x1="1200" y1="0" x2="1200" y2="40" stroke="#00D4AA" stroke-width="2" opacity="0.6"/>
  <!-- Bottom-left -->
  <line x1="0" y1="400" x2="40" y2="400" stroke="#00D4AA" stroke-width="2" opacity="0.4"/>
  <line x1="0" y1="400" x2="0" y2="360" stroke="#00D4AA" stroke-width="2" opacity="0.4"/>
  <!-- Bottom-right -->
  <line x1="1200" y1="400" x2="1160" y2="400" stroke="#FF6B6B" stroke-width="2" opacity="0.4"/>
  <line x1="1200" y1="400" x2="1200" y2="360" stroke="#FF6B6B" stroke-width="2" opacity="0.4"/>
</svg>